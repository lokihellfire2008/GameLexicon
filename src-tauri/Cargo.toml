[package]
name = "game-collection"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2.8.2", features = [] }
tauri-plugin-shell = "2.0"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sqlx = { version = "0.7", features = ["runtime-tokio", "macros", "sqlite", "chrono", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "cookies", "stream", "native-tls"] }
keyring = "2"
async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
quick-xml = "0.31"
tauri-plugin-http = "2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
quick-xml = { version = "0.31", features = ["serialize"] }
chrono = { version = "0.4", features = ["serde"] }




